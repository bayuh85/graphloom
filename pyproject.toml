[project]
name = "graphloom"
version = "0.1.0"
description = "Build a queryable knowledge graph of a repository for coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Graphloom contributors" }]
keywords = ["knowledge-graph", "mcp", "code-intelligence", "atmorouter"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
graphloom = "graphloom.cli:main"

[project.urls]
Homepage = "https://atmorouter.dev"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
